{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h4 class="mb-3 text-center">Crear cuenta de tendero</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" name="nombre" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Nombre de la tienda</label>
            <input type="text" name="tienda" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="usuario" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary w-100" style="background:#2C5F8A;border:none;">Registrarme</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="{{ url_for('login') }}">Ya tengo cuenta</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
