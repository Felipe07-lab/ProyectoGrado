{% extends "base.html" %}
{% block title %}Nueva venta{% endblock %}
{% block content %}
<h3>🧾 Registrar venta</h3>
<div class="card shadow-sm" style="max-width:650px;">
  <div class="card-body">
    <form method="post" id="ventaForm">
      <div id="items">
        <div class="row item-row mb-2">
          <div class="col-7">
            <select name="producto_id" class="form-select" required>
              <option value="">Seleccione un producto...</option>
              {% for p in productos %}
              <option value="{{ p.id }}" data-precio="{{ p.precio_venta }}" data-stock="{{ p.stock_actual }}">
                {{ p.nombre }} — ${{ '{:,.0f}'.format(p.precio_venta) }} (stock: {{ p.stock_actual }})
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="col-3">
            <input type="number" name="cantidad" class="form-control" min="1" value="1" required>
          </div>
          <div class="col-2">
            <button type="button" class="btn btn-outline-danger removeRow">✕</button>
          </div>
        </div>
      </div>
      <button type="button" id="addRow" class="btn btn-outline-secondary btn-sm mb-3">+ Agregar producto</button>
      <hr>
      <button type="submit" class="btn btn-success w-100">Confirmar venta</button>
    </form>
  </div>
</div>

<script>
document.getElementById('addRow').addEventListener('click', function() {
  const items = document.getElementById('items');
  const row = items.firstElementChild.cloneNode(true);
  row.querySelector('select').value = '';
  row.querySelector('input[type=number]').value = 1;
  items.appendChild(row);
});
document.getElementById('items').addEventListener('click', function(e) {
  if (e.target.classList.contains('removeRow')) {
    const items = document.getElementById('items');
    if (items.children.length > 1) e.target.closest('.item-row').remove();
  }
});
</script>
{% endblock %}
