{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h4 class="mb-3 text-center">🏪 Sistema de Inventario y Ventas</h4>
        <p class="text-muted text-center">Tiendas de barrio — Localidad de Suba</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="usuario" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" style="background:#2C5F8A;border:none;">Iniciar sesión</button>
        </form>
        <p class="text-center mt-3 mb-0">
          <a href="{{ url_for('registro') }}">Crear una cuenta nueva</a>
        </p>
        <hr>
        <p class="text-muted small text-center mb-0">
          Usuario de demostración: <b>demo</b> / Contraseña: <b>demo1234</b>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
