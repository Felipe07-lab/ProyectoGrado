{% extends "base.html" %}
{% block title %}{{ 'Editar' if producto else 'Nuevo' }} producto{% endblock %}
{% block content %}
<h3>{{ '✏️ Editar producto' if producto else '➕ Registrar producto' }}</h3>
<div class="card shadow-sm" style="max-width:500px;">
  <div class="card-body">
    <form method="post">
      <div class="mb-2">
        <label class="form-label">Nombre del producto</label>
        <input type="text" name="nombre" class="form-control" required value="{{ producto.nombre if producto else '' }}">
      </div>
      <div class="mb-2">
        <label class="form-label">Categoría</label>
        <input type="text" name="categoria" class="form-control" value="{{ producto.categoria if producto else '' }}">
      </div>
      <div class="row">
        <div class="col mb-2">
          <label class="form-label">Precio de compra</label>
          <input type="number" step="0.01" name="precio_compra" class="form-control" value="{{ producto.precio_compra if producto else 0 }}">
        </div>
        <div class="col mb-2">
          <label class="form-label">Precio de venta</label>
          <input type="number" step="0.01" name="precio_venta" class="form-control" value="{{ producto.precio_venta if producto else 0 }}">
        </div>
      </div>
      <div class="row">
        <div class="col mb-2">
          <label class="form-label">Stock inicial</label>
          <input type="number" name="stock_actual" class="form-control" value="{{ producto.stock_actual if producto else 0 }}">
        </div>
        <div class="col mb-2">
          <label class="form-label">Stock mínimo (alerta)</label>
          <input type="number" name="stock_minimo" class="form-control" value="{{ producto.stock_minimo if producto else 0 }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Fecha de vencimiento</label>
        <input type="date" name="fecha_vencimiento" class="form-control"
               value="{{ producto.fecha_vencimiento.isoformat() if producto and producto.fecha_vencimiento else '' }}">
      </div>
      <button type="submit" class="btn btn-primary w-100" style="background:#2C5F8A;border:none;">Guardar producto</button>
      <a href="{{ url_for('productos') }}" class="btn btn-link w-100 text-center">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
